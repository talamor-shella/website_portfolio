<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio -Before OJT</title>
    <link rel="stylesheet" href="style/before_ojt.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="assets/mylogo.png" alt="Logo">
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about_me.html">ABOUT ME</a>
            <a href="portfolio.html" class="active">PORTFOLIO</a>
        </nav>
    </header>

<!-- Main Sub-Portfolio Container -->
    <div class="sub-portfolio-container">
        
        <!-- Back Button to Main Portfolio -->
        <div class="back-navigation">
            <a href="portfolio.html" class="back-btn">
                <img src="assets/backbutton.png" alt="Back Arrow">
                <span>PORTFOLIO</span>
            </a>
        </div>

        <!-- LEFT & RIGHT NAVIGATION BUTTONS -->
        <button class="orbit-nav-btn arrow-left" id="prevBtn" aria-label="Previous">
            <img src="assets/backbutton.png" alt="Left Arrow">
        </button>

        <button class="orbit-nav-btn arrow-right" id="nextBtn" aria-label="Next">
            <img src="assets/right_button.png" alt="Right Arrow">
        </button>

        <!-- The Central Dynamic Spotlight Workspace -->
        <div class="spotlight-workspace">
            
<!-- Central Dynamic Spotlight Workspace -->
        <div class="spotlight-workspace">
            
            <!-- Central Banners Layer -->
            <div class="center-banner-group">
                <div class="banner-wrapper before-wrapper">
                    <img src="assets/banner_ver2.png" alt="Before" class="banner-title before-title">
                    <span class="banner-text">BEFORE</span>
                </div>

                <div class="banner-wrapper ojt-wrapper">
                    <img src="assets/banner_ver3.png" alt="OJT" class="banner-title ojt-title">
                    <span class="banner-text">OJT</span>
                </div>
            </div>

            <!-- Outer Orbit Folders -->
            <div class="orbit-ring" id="orbitRing">
                
                <div class="orbit-folder">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Memorandum of Agreement</span>
                </div>

                <div class="orbit-folder" data-pdf="assets/before_ojt_pdfs/loi_talamor.pdf">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Letter of Intent</span>
                </div>

                <div class="orbit-folder" data-pdf="assets/before_ojt_pdfs/loe_talamor.pdf">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Letter of Endorsement</span>
                </div>

                <div class="orbit-folder">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Student Waiver</span>
                </div>

                <div class="orbit-folder">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Internship Agreement</span>
                </div>

                <div class="orbit-folder">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title">Consent Form</span>

                </div>
                <div class="orbit-folder" data-pdf="assets/before_ojt_pdfs/medcert.pdf">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title"> Medical Certificate</span>
                </div>

                <div class="orbit-folder">
                    <img src="assets/foldericon.png" alt="Folder">
                    <span class="folder-title"> File - 8</span>
                </div>
                
            </div>

        </div>

    </div>

        <!-- Social Links (Fixed at Bottom-Left Corner) -->
        <div class="social-links">
            <a href="https://linkedin.com" target="_blank">
                <img src="assets/linkedin_logo.png" alt="LinkedIn">
            </a>
            <a href="https://github.com" target="_blank">
                <img src="assets/github_logo.png" alt="GitHub">
            </a>
        </div>

    </div>

<!-- PDF VIEWER MODAL -->
<div class="pdf-modal" id="pdfModal">

    <div class="pdf-viewer">

        <button class="pdf-close" id="pdfClose" aria-label="Close PDF">
            &times;
        </button>

        <iframe
            id="pdfFrame"
            src=""
            title="PDF Viewer">
        </iframe>

    </div>

</div>

    <script src="scripts/orbit.js"></script>
</body>
</html>
